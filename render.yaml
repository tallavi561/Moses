# Render blueprint for all 6 MoSes services.
#
# IMPORTANT: Render has no native MongoDB offering - MONGODB_URI must point at an
# external cluster (e.g. MongoDB Atlas free tier). Set it manually per service in
# the Render dashboard (marked sync: false below) after the first deploy.
#
# fromService env vars let services discover each other's Render-assigned URLs
# automatically, so no hardcoded internal hostnames are needed.

services:
  - type: web
    name: ingestion-service
    env: docker
    dockerfilePath: ./ingestion-service/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: FLUSH_INTERVAL_SECONDS
        value: "5"
      - key: BUCKET_GRANULARITY_MINUTES
        value: "1"
      - key: RETENTION_DAYS
        value: "14"

  - type: web
    name: search-service
    env: docker
    dockerfilePath: ./search-service/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: BUCKET_GRANULARITY_MINUTES
        value: "1"

  - type: web
    name: process-monitor-service
    env: docker
    dockerfilePath: ./process-monitor-service/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false

  - type: web
    name: ai-service
    env: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SEARCH_SERVICE_URL
        fromService:
          type: web
          name: search-service
          property: hostport
      - key: PROCESS_MONITOR_SERVICE_URL
        fromService:
          type: web
          name: process-monitor-service
          property: hostport
      # Language model for free-text questions - provider-agnostic, chosen purely by config.
      # With no key/provider the service falls back to the simple keyword translator.
      #   LLM_PROVIDER: anthropic | openai-compatible | none
      #   LLM_BASE_URL: required for openai-compatible (e.g. https://api.openai.com/v1)
      - key: LLM_PROVIDER
        value: "none"
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false

  - type: web
    name: auth-service
    env: docker
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      # Signing key for login tokens: a long random string (32+ characters), and the SAME
      # value here and on api-gateway. Neither service starts without it.
      - key: JWT_SECRET
        sync: false

  - type: web
    name: api-gateway
    env: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Must equal auth-service's JWT_SECRET - the gateway verifies the tokens it issues.
      - key: JWT_SECRET
        sync: false
      - key: AUTH_SERVICE_URL
        sync: false
      # Downstream URLs are the services' PUBLIC https://*.onrender.com URLs, set by hand
      # in the dashboard. Not fromService/hostport: that is the private-network address,
      # which the gateway cannot reach reliably here and which cannot wake a sleeping
      # free-tier backend (see ARCHITECTURE.md "Gotchas"). sync: false also stops a
      # Blueprint sync from overwriting the dashboard values.
      - key: INGESTION_SERVICE_URL
        sync: false
      - key: SEARCH_SERVICE_URL
        sync: false
      - key: PROCESS_MONITOR_SERVICE_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false # set to the deployed frontend's URL once it's known

  - type: web
    name: moses-monitor-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # fromService/hostport only resolves to Render's private network, which the
      # browser can't reach - and this is a build-time Vite var anyway, baked into
      # the static bundle, not read at runtime. Set it to api-gateway's public
      # https://*.onrender.com URL after that service's first deploy, then trigger
      # a manual redeploy of this static site to pick it up.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA client-side routing (react-router): any path that isn't a real static
      # file (JS/CSS/images, or moses-monitoring-skill.md) must fall through to
      # index.html, or a direct hit / refresh on e.g. /p/demo/flow 404s.
      - type: rewrite
        source: /*
        destination: /index.html
