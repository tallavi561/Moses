server:
  # 8080 is reserved for Render's default PORT only; locally it was already
  # occupied by an unrelated process on this machine, so the local default
  # is 8085 instead. Render always overrides this via the PORT env var.
  port: ${PORT:8085}

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: api-gateway

moses:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  routes:
    ingestion-service: ${INGESTION_SERVICE_URL:http://localhost:8081}
    search-service: ${SEARCH_SERVICE_URL:http://localhost:8082}
    process-monitor-service: ${PROCESS_MONITOR_SERVICE_URL:http://localhost:8083}
    ai-service: ${AI_SERVICE_URL:http://localhost:8084}
